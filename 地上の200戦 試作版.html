function wbg(){const im=S.world&&ART[S.world.c.f[0].n],b=document.body;b.style.background=im?`linear-gradient(rgba(0,0,0,.4),rgba(0,0,0,.4)),url(${im}) center/cover fixed`:'';$('app').classList.toggle('wbg',!!im)}
const wk=()=>S.world&&S.world.c.f[0].w;
const gc=c=>{if(wk()==='wl'&&(c.t==='s'||c.usedSp))return 1;return c.usedSp?c.sp.c:fc(c).c};
const condOk=(h,z)=>{const c=h.cond,f=ef(z);return !!((c.n&&c.n.some(s=>fc(z).n.includes(s)))||(c.k&&f.k.includes(c.k)))};
const condTxt=c=>c.n?'「'+c.n.join('」「')+'」を名前に含むレジデントの上':(c.k==='B'?'ブロッカーを持つレジデントの上':'狙撃を持つレジデントの上');
function kill(p,zi,how){const z=p.zone[zi];if(!z)return false;const f=ef(z);if(f.k.includes('I')&&how==='d'){log(f.n+'は不死身(破壊されない)');return false}
if(how==='d'){if(wk()==='ht'&&S.world.o===p.i){log('天界:破壊されない');return false}
if(f.k.includes('R')){const h=p.hand.find(x=>x.pa&&x.cond&&fc(x).n.includes('橋')&&condOk(x,z));if(h){evolve(p,zi,h);log(`転生!${f.n}が${fc(h).n}に変化`);return false}}}
p.zone[zi]=null;FX.push([p.i,zi]);if(how==='b'){z.tap=0;z.flip=0;z.sf=0;z.o=null;if(z.under){z.under.forEach(x=>gy(p,x));z.under=null}p.deck.unshift(z)}else gy(p,z);return true}
function evolve(p,zi,h){const base=p.zone[zi];p.hand.splice(p.hand.indexOf(h),1);h.o=p.i;h.tap=base.tap;h.sick=base.sick;h.down=0;h.flip=0;h.under=[base].concat(base.under||[]);base.under=null;p.zone[zi]=h;h.an='slam'}
function evoAsk(){const me=cur(),o=[];me.hand.filter(c=>c.pa).forEach(h=>me.zone.forEach((z,zi)=>{if(z&&!z.pa&&condOk(h,z))o.push({h,zi,z})}));if(o.length){S.evo=o;render()}}
function evo(k){const o=S.evo[k],me=cur();S.evo=null;evolve(me,o.zi,o.h);S.q=[()=>slamFx(me.i,o.zi)];log(`${fc(o.z).n}が${fc(o.h).n}に変化`);render()}
function setPk(p,m,cs,cb,sk,q){if(!cs.length){log('対象がありません');return flush()}S.pick={p,m,cs,cb,sk,q};flush()}
function pickD(i){const k=S.pick,p=k.p,c=k.cs[i];S.pick=null;if(k.m==='s')return srchDone(k,c);if(k.cb){if(c)k.cb(c);return flush()}if(!c)return render();
p.hand.splice(p.hand.indexOf(c),1);if(k.m==='b'){p.deck.unshift(c);log(`P${p.i+1}が1枚を山札の下へ`)}else{log(`P${p.i+1}が${fc(c).n}を墓地へ`);gy(p,c);if(k.n>1&&p.hand.length)S.pick={p,m:'d',cs:p.hand,n:k.n-1}}render()}
function endTurn(){const tn=S.tn||0;if((S.dl||[]).some(d=>d.t===tn)){S.p.forEach(p=>{if(p.zone[1])kill(p,1,'d')});S.dl=S.dl.filter(d=>d.t!==tn)}FX.splice(0).forEach(([p,i])=>brk(p,i));S.tn=tn+1;S.noW=0;S.turn=1-S.turn;S.phase='main';S.sel=S.atk=null;S.insp=S.mv=null;S.cover=(ON||CPU)?0:1;if(ON||CPU)go();else render()}
function vacAtk(){const me=cur(),o=opp(),a=me.zone[S.atk];if(!a)return;a.tap=1;S.atk=null;setPk(me,'v',o.zone.filter(z=>z),z=>{kill(o,o.zone.indexOf(z),'g')},0,'墓地に置く相手のレジデントを選択')}
function atk3(t){const me=cur(),o=opp(),ai=S.atk,a=me.zone[ai],w=wk();if(w==='bw')a.ao=1;
if(t==='deck'){log('直接攻撃!');if(me.i===0)S.da=(S.da||0)+1;const n=w==='fr'?3:2;if(draw(o,n)&&!S.over)S.pick={p:o,m:'d',cs:o.hand,n:n-1}}
else{const D=o.zone[t];if(D.down){D.down=0;log('伏せていた'+fc(D).n+'が表向きに')}const fa=ef(a),fd=ef(D);let A=fa.a,B=fd.d;
if(w==='bw'){A=1+(Math.random()*6|0);B=1+(Math.random()*6|0);log(`🎲攻${A} vs 守${B}`)}
if(fa.k.includes('K')||fd.k.includes('K')){kill(me,ai,'d');kill(o,t,'d');log('バトルブレイカーで相打ち')}
else if(A>B){log(kill(o,t,'d')?`${fa.n}が${fd.n}を倒した`:`${fd.n}は破壊されない`)}
else{log(`${fd.n}が防いだ`);kill(me,ai,'d')}}
S.atk=null;clash(ai,t);lock(520);setTimeout(flush,520)}
function playSpell(k){const me=cur(),o=opp(),c=me.hand.splice(S.sel,1)[0],f=k===9?c.sp:c.f[k],e=f.e,tn=S.tn||0;S.sel=null;log(`呪文「${f.n}」`);if(k===9)c.usedSp=1;
if(e==='draw')draw(me,2);
else if(e==='kill'){let b=-1;o.zone.forEach((z,i)=>{if(z&&(b<0||ef(z).a>ef(o.zone[b]).a))b=i});if(b>=0)kill(o,b,'d')}
else if(e==='nowld')S.noW=1;
else if(e==='pierce')(S.dl=S.dl||[]).push({t:tn+1});
else if(e==='wail')(S.md=S.md||[]).push({t:tn+1,p:o.i,e:'c3'});
else if(e==='glory')[o,me].forEach(p=>p.zone.forEach((z,i)=>{if(z&&ef(z).a<=3)kill(p,i,'d')}));
else if(e==='inf'){gy(me,c);const L=[];[me,o].forEach(p=>p.zone.forEach(z=>z&&!z.down&&L.push(z)));return setPk(me,'w',L,z=>{z.inf=1;log(fc(z).n+'の守りが∞に')},0,'守りを∞にするレジデントを選択')}
else if(e==='vac'){gy(me,c);const ch=n=>{const L=o.zone.filter(z=>z);if(!n||!L.length)return;setPk(me,'v',L,z=>{kill(o,o.zone.indexOf(z),'b');ch(n-1)},0,`山札の下に置く相手のレジデントを選択(あと${n}体)`)};return ch(2)}
else if(e==='regen'){gy(me,c);return setPk(me,'g',me.grave.filter(x=>x.t==='s'||x.usedSp),x=>{me.grave.splice(me.grave.indexOf(x),1);x.usedSp=0;me.deck.unshift(x);log('墓地の呪文を山札の下へ')},1,'山札の下に置く呪文を選択(置かない選択も可)')}
else if(e==='dbl'){gy(me,c);const L=[];[me,o].forEach(p=>p.zone.forEach(z=>z&&!z.down&&L.push(z)));return setPk(me,'w',L,z=>{const i=me.deck.findIndex(x=>x.k===z.k);if(i<0)return log('山札に同名カードがない');const d=me.deck.splice(i,1)[0];d.an='drw';me.hand.push(d);log(fc(d).n+'を手札に加えた')},0,'同名カードを手札に加えるレジデントを選択')}
gy(me,c);flush()}

function parseCode(s){s=(s||'').trim().toUpperCase();if(!/^D1[A-Y]+$/.test(s))return null;const cnt={};let i=0;for(const ch of s.slice(2)){const v=DCA.indexOf(ch);[v/5|0,v%5].forEach(n=>{const t=CAT[i++];if(t&&n)cnt[t.k]=n})}return cnt}

let cost=0,sec=0;const list=[];Object.keys(ED.cnt).forEach(k=>{const t=CM[k];if(!t)return;const m=ED.cnt[k]-own(k);if(m>0){if(!CR[t.rar])sec++;else cost+=m*CR[t.rar];list.push(`${k}×${m}`)}});
